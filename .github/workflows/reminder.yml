name: Monthly Split Reminder
on:
  schedule:
    - cron: '37 1 4 * *'
  workflow_dispatch:

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Message
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d text="💰 Monthly reminder!%0A%244.66 each → 8889 1059%0APlease send by today (4th) 🙏"
